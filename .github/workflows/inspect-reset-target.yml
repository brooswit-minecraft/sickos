name: Inspect reset target

# MINECRAFT-378: read-only preflight evidence for a proposed reset-server-world.py
# dispatch. Dispatch-only, like reset-world.yml itself; never fires on push.
# Issues exactly one rcon command (the same read-only `list` query the real
# reset script uses to confirm zero players) and SFTP reads only -- no write,
# no restart, no save-all. Mirrors the read-only-inspection precedent
# (xaero/read-only-inspection, commit 40564dc75229397d0c9230c4af9a2c62543b8d21).
on:
  workflow_dispatch:
    inputs:
      expected_world:
        description: Exact current world directory a reset would target (read-only check, nothing is changed)
        required: true
        type: string
      new_world:
        description: Proposed new world directory (read-only check that it does not already exist)
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: brooswit-minecraft/schematic
          ref: v1
          path: .schematic-tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'paramiko==4.0.0' 'tomlkit==0.13.3'
      - run: python -m unittest discover -s tests -p 'test_inspect_reset_target.py'
      - name: Read-only target/world/config/zero-player evidence
        run: python scripts/inspect-reset-target.py
        env:
          EXPECTED_WORLD: ${{ inputs.expected_world }}
          NEW_WORLD: ${{ inputs.new_world }}
          SERVER_SFTP_HOST: ${{ vars.SERVER_SFTP_HOST }}
          SERVER_SFTP_PORT: ${{ vars.SERVER_SFTP_PORT }}
          SERVER_SFTP_PATH: ${{ vars.SERVER_SFTP_PATH }}
          SERVER_SFTP_USERNAME: ${{ secrets.SERVER_SFTP_USERNAME }}
          SERVER_SFTP_PASSWORD: ${{ secrets.SERVER_SFTP_PASSWORD }}
          SERVER_SFTP_PRIVATE_KEY: ${{ secrets.SERVER_SFTP_PRIVATE_KEY }}
          SERVER_SFTP_KNOWN_HOSTS: ${{ secrets.SERVER_SFTP_KNOWN_HOSTS }}
          SERVER_RCON_HOST: ${{ vars.SERVER_RCON_HOST }}
          SERVER_RCON_PORT: ${{ vars.SERVER_RCON_PORT }}
          SERVER_RCON_PASSWORD: ${{ secrets.SERVER_RCON_PASSWORD }}
