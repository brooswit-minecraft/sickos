name: Diagnose server logs

# Read-only diagnostic: lists the server's top-level, logs, crash-reports and
# mods directories over the existing SFTP access and prints the tail of
# logs/latest.log and the newest crash report. Runs only on pushes to the
# diag-server-logs branch. Changes nothing on the server.
on:
  push:
    branches: [diag-server-logs]

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'paramiko==4.0.0'
      - name: Read server logs (read-only)
        env:
          SERVER_SFTP_HOST: ${{ vars.SERVER_SFTP_HOST }}
          SERVER_SFTP_PORT: ${{ vars.SERVER_SFTP_PORT }}
          SERVER_SFTP_PATH: ${{ vars.SERVER_SFTP_PATH }}
          SERVER_SFTP_USERNAME: ${{ secrets.SERVER_SFTP_USERNAME }}
          SERVER_SFTP_PASSWORD: ${{ secrets.SERVER_SFTP_PASSWORD }}
          SERVER_SFTP_KNOWN_HOSTS: ${{ secrets.SERVER_SFTP_KNOWN_HOSTS }}
        run: python scripts/diag_server_logs.py
