name: Server tuning

# Re-applies repository-owned Dynamic Atmosphere tuning to the live server.
# Two triggers, deliberately NOT the same shape:
#
#   - push (paths below): fires immediately for a config/script edit on main.
#     Safe to fire right away because nothing about the live jar or the live
#     config's existence changes here — the sync only ever patches keys that
#     are already allow-listed into a config file that's already there.
#
#   - workflow_run on "Server update": a DA version bump (mods/dynamic-atmosphere.pw.toml)
#     ships as part of a pack release, and MINECRAFT-50 asked for the sync to
#     re-run after that release deploys so a DA configVersion bump's
#     rename-aside-and-regenerate-at-defaults doesn't silently discard this
#     repository's tuning. Deliberately NOT a `paths:` entry for
#     mods/dynamic-atmosphere.pw.toml on the push trigger above: a path
#     trigger fires the instant the bump lands on main, which is BEFORE
#     "Server update" has re-pointed/restarted the server and DA has had a
#     chance to regenerate its config — exactly the ordering MINECRAFT-50
#     warned against ("it will patch a file that is about to be replaced").
#     Chaining on workflow_run, the same shape server-update.yml itself uses
#     to chain off "Release", guarantees this only starts once that run has
#     finished. The sync is idempotent (patch_toml no-ops when nothing
#     differs) and safe to re-run on every deploy, not just ones that bumped
#     DA, so there's no need to filter on what the update actually changed.
#
#     NOTE ON A TICKET CLAIM, VERIFIED AND FOUND WRONG: MINECRAFT-50 asserted
#     this workflow and server-update.yml "already share the SFTP
#     concurrency group". As of this change that is NOT true — read
#     server-update.yml and its reusable-server-update.yml yourself:
#     neither declares a `concurrency:` block, and that workflow talks to
#     Modrinth's API, not SFTP. The `schematic-sftp-${{ github.repository }}`
#     group below is shared with reset-world.yml (see README.md, "Live
#     server tuning"), not with server-update.yml. The workflow_run trigger
#     above is what orders this workflow after a deploy — not a shared lock.
#
#     MINECRAFT-258 FOLLOW-UP: "Server update" completing with conclusion
#     success does NOT mean it deployed — its own deployment-policy job
#     honors a `Release-Only: true` trailer by skipping the restart, but a
#     skipped job still leaves the workflow's overall conclusion as
#     success, so the naive `conclusion == 'success'` check below used to
#     fire this live SFTP sync even on a Release-Only release (observed:
#     https://github.com/brooswit-minecraft/sickos/actions/runs/39049941209
#     ran right after https://github.com/brooswit-minecraft/sickos/actions/runs/39049928024
#     skipped its own deploy).
#
#     FIRST FIX, FOUND WRONG BY REVIEW: re-reading the Release-Only trailer
#     off `github.event.workflow_run.head_sha` is not safe — that field is
#     NOT guaranteed to be the commit that actually triggered the chain.
#     If main moves between "Release" starting and "Server update"
#     finishing, head_sha can resolve to a LATER commit than the one
#     deployment-policy actually evaluated, so this workflow would honor
#     a different commit's trailer than the one "Server update" itself
#     used — exactly backwards for a second hop in a workflow_run chain.
#     (GitHub's own workflow_run docs: the event reports the default
#     branch's current head, not a pinned reference to the triggering
#     push.) FIX: don't re-derive the decision from a commit at all —
#     read the ACTUAL job evidence of the specific triggering run, by its
#     immutable `github.event.workflow_run.id`, via the Actions API. A
#     literal job named "server-update" (not "server-update / ...") only
#     ever appears, and only with conclusion skipped, when
#     deployment-policy decided deploy=false and the reusable-workflow
#     call itself never ran. This is authoritative for THAT run
#     specifically — no commit, no trailer, no SHA-drift possible, since
#     a run's own job list cannot describe any other run.
#
#     SECOND FIX, FOUND INCOMPLETE BY REVIEW: counting "server-update /
#     deploy-method" success as deployment evidence was wrong — it's pure
#     validation (one case statement over the configured deploy method)
#     and never touches the server. Worse, "server-update / Update
#     server" (the Modrinth-API deploy method's own job) can also succeed
#     on a no-op "not configured, skipping" path without deploying
#     anything. FIX: only "server-update / Upload and restart server"
#     (the SFTP path's actual upload-and-restart step) succeeding counts
#     as positive evidence; any sibling job in a
#     failure/cancelled/timed_out/action_required state still
#     disqualifies it. The classification itself now lives in
#     scripts/server_tuning_deploy_evidence.py (not inline bash/jq), unit
#     tested against eight real/synthetic job-list fixtures captured from
#     the provider in tests/test_server_update_policy.py — a regression
#     here, including all the way back to the original MINECRAFT-258 bug,
#     now has behavioral coverage, not just YAML-text assertions.
#     Ambiguous, missing or partially-failed job evidence fails CLOSED
#     (no live write), same polarity as server-update.yml's own
#     `deploy == 'true'` and the fail-closed contract
#     scripts/server_update_policy.py already asserts for a malformed
#     trailer (tests/test_server_update_policy.py::test_invalid_value_fails_closed).
#     The sync job's gate below is `== 'true'` (not `!= 'false'`) with
#     `!cancelled()` (not `always()`) for the same reason: a guard-job
#     failure or an operator cancel must not leave the live write
#     eligible by default.
#
#     KNOWN NOT HARDENED (recorded, not fixed, per review): the Actions
#     API's /jobs endpoint returns the LATEST attempt of the triggering
#     run, not necessarily its original github.event.workflow_run.run_attempt
#     (re-runs do happen on this repo); it also reads only page 1 of jobs
#     (fails in the safe direction if ever paginated); and nothing pins
#     the hardcoded "server-update" job name to server-update.yml's own
#     job key, so a rename there would silently make this guard permanent
#     deploy=false (safe, but it would quietly stop MINECRAFT-50's
#     post-deploy sync with CI green throughout).
on:
  push:
    branches: [main]
    paths:
      - server-config.json
      - scripts/sync-server-config.py
      - tests/test_sync_server_config.py
      - .github/workflows/server-tuning.yml
  workflow_run:
    workflows: ["Server update"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: schematic-sftp-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-only-guard:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.policy.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read actual deploy evidence from the triggering run's own jobs
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # The classifier (scripts/server_tuning_deploy_evidence.py,
          # unit-tested against eight real/synthetic job-list fixtures in
          # tests/test_server_update_policy.py) decides; this step only
          # fetches. A failed `gh api` call produces no stdout, which the
          # script's own JSON-parse failure path already treats as
          # deploy=false -- no separate error handling needed here.
          gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
            | python3 scripts/server_tuning_deploy_evidence.py >> "$GITHUB_OUTPUT"

  sync:
    needs: [release-only-guard]
    if: >-
      !cancelled() &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        needs.release-only-guard.outputs.deploy == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: brooswit-minecraft/schematic
          ref: v1
          path: .schematic-tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install config sync dependencies
        run: python -m pip install 'paramiko==4.0.0' 'tomlkit==0.13.3'
      - name: Run focused config sync tests
        run: python -m unittest discover -s tests -p 'test_sync_server_config.py'
      - name: Atomically synchronize live server tuning
        run: python scripts/sync-server-config.py
        env:
          SERVER_SFTP_HOST: ${{ vars.SERVER_SFTP_HOST }}
          SERVER_SFTP_PORT: ${{ vars.SERVER_SFTP_PORT }}
          SERVER_SFTP_PATH: ${{ vars.SERVER_SFTP_PATH }}
          SERVER_SFTP_USERNAME: ${{ secrets.SERVER_SFTP_USERNAME }}
          SERVER_SFTP_PASSWORD: ${{ secrets.SERVER_SFTP_PASSWORD }}
          SERVER_SFTP_PRIVATE_KEY: ${{ secrets.SERVER_SFTP_PRIVATE_KEY }}
          SERVER_SFTP_KNOWN_HOSTS: ${{ secrets.SERVER_SFTP_KNOWN_HOSTS }}
