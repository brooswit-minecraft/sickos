name: Reset hosted world
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to permanently replace the world without a backup'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: schematic-sftp-${{ github.repository }}
  cancel-in-progress: false
jobs:
  reset:
    if: inputs.confirm == 'RESET'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brooswit-minecraft/schematic
          ref: v1
          path: schematic
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'paramiko==4.0.0'
      - name: Reset world and grant operator access
        run: python scripts/reset-world.py
        env:
          CONFIRM_RESET: ${{ inputs.confirm }}
          SERVER_RCON_HOST: ${{ vars.SERVER_RCON_HOST }}
          SERVER_RCON_PORT: ${{ vars.SERVER_RCON_PORT }}
          SERVER_RCON_PASSWORD: ${{ secrets.SERVER_RCON_PASSWORD }}
          SERVER_RCON_SHUTDOWN_TIMEOUT: '300'
          SERVER_SFTP_HOST: ${{ vars.SERVER_SFTP_HOST }}
          SERVER_SFTP_PORT: ${{ vars.SERVER_SFTP_PORT }}
          SERVER_SFTP_PATH: ${{ vars.SERVER_SFTP_PATH }}
          SERVER_SFTP_USERNAME: ${{ secrets.SERVER_SFTP_USERNAME }}
          SERVER_SFTP_PASSWORD: ${{ secrets.SERVER_SFTP_PASSWORD }}
          SERVER_SFTP_PRIVATE_KEY: ${{ secrets.SERVER_SFTP_PRIVATE_KEY }}
          SERVER_SFTP_KNOWN_HOSTS: ${{ secrets.SERVER_SFTP_KNOWN_HOSTS }}
