# Read-only harness for the sickos Modrinth listing text.
#
# Serves epic SICKOS-1 / story SICKOS-5 ("Update the sickos Modrinth listing
# text through rinth project edit"). This is PHASE 1, the READ-ONLY half:
# it reads the live project via `rinth --json project get` so the current
# `description` and `body` can be reviewed and a reasoned "edit warranted?"
# judgment made. It performs NO writes. An edit step is Phase 2, added only
# after explicit sign-off recorded on SICKOS-9.
#
# workflow_dispatch ONLY, always — this is a hand-run investigation step,
# not part of the release path.

name: rinth listing (read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Pinned by hand, NOT copied from rinth's README (that has bitten this
  # fleet before). v0.9.1 is the current rinth tag.
  RINTH_REF: github:brooswit-minecraft/rinth#v0.9.1

jobs:
  read-listing:
    name: Read rinth project listing (description + body)
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2

      - name: Resolve project id
        id: project
        env:
          PROJECT_ID_VAR: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          project_id="${PROJECT_ID_VAR:-RuhnnPqO}"
          echo "Resolved Modrinth project id: $project_id"
          printf 'id=%s\n' "$project_id" >> "$GITHUB_OUTPUT"
          {
            echo "## rinth listing (read-only)"
            echo ""
            echo "Resolved project id: \`$project_id\` (from \`vars.MODRINTH_PROJECT_ID\`, falling back to the literal \`RuhnnPqO\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- rinth --json project get ---------------------------------------
      # The human output of `project get` does not print `description` or
      # `body` at all (see formatProject in rinth's src/commands/project.ts)
      # — `--json` is required to see them. `--json` is a global flag parsed
      # anywhere in argv, so it is passed before the subcommand here.
      - name: rinth project get (json)
        id: project_get
        if: always()
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.id }}
        run: |
          set +e
          bunx --bun "$RINTH_REF" --json project get "$PROJECT_ID" > >(tee project_get.stdout.log) 2> >(tee project_get.stderr.log >&2)
          ec=$?
          set -e
          echo "exit_code=$ec" >> "$GITHUB_OUTPUT"
          echo "rinth --json project get exit code: $ec"

          pretty=""
          if [ "$ec" = "0" ] && jq -e . project_get.stdout.log > project_get.pretty.json 2>/dev/null; then
            pretty=1
          fi

          {
            echo "### rinth --json project get $PROJECT_ID"
            echo "- exit code: \`$ec\`"
            echo ""
            if [ "$pretty" = "1" ]; then
              echo "Full JSON (pretty-printed):"
              echo '```json'
              cat project_get.pretty.json
              echo '```'
              echo ""
              echo "\`description\`:"
              echo '```'
              jq -r '.description // "<absent>"' project_get.pretty.json
              echo '```'
              echo ""
              echo "\`body\`:"
              echo '```'
              jq -r '.body // "<absent>"' project_get.pretty.json
              echo '```'
            else
              echo "-- stdout --"
              echo '```'
              cat project_get.stdout.log
              echo '```'
            fi
            echo ""
            echo "-- stderr --"
            echo '```'
            cat project_get.stderr.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Raw JSON as an artifact too, in case $GITHUB_STEP_SUMMARY truncates
      # a long body.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rinth-project-get-json
          path: |
            project_get.stdout.log
            project_get.stderr.log
            project_get.pretty.json
          if-no-files-found: ignore
          retention-days: 30

      # --- PHASE 1b: is any of the six unlisted mods a dependency ----------
      # Story SICKOS-5 wants to know, before ruling on the Mods list, whether
      # any of the six mods.pw.toml files not named in the body's "## Mods"
      # list are actually required dependencies of one of the eight NAMED
      # mods — directly or transitively through each other. `versions list`
      # (src/commands/versions.ts) prints the full versions array including
      # each version's `dependencies` (project_id + dependency_type). This
      # fetches all fourteen mods' pinned versions, builds the dependency
      # graph from the eight named mods outward, and reports reachability to
      # each of the six unlisted ones. Still read-only: no writes anywhere.
      - name: Check whether unlisted mods are required dependencies
        id: dep_check
        if: always()
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          cat > dep_check.py <<'PY'
          import json
          import os
          import subprocess
          import sys
          from collections import deque

          RINTH_REF = os.environ["RINTH_REF"]

          # (display name, project id, pinned version id)
          NAMED = [
              ("Create", "LNytGWDc", "UjX6dr61"),
              ("Create: Power Grid", "eWiBLJ9R", "ip4gJrgx"),
              ("Create: Aeronautics", "oWaK0Q19", "Vzp221Un"),
              ("Flowing Fluids", "s1I3BT95", "k37oVEnG"),
              ("Countered's Terrain Slabs", "SJu6sklj", "1dYKrrP8"),
              ("Tectonic", "lWDHr9jE", "vNrkxC3z"),
              ("Project Atmosphere", "qIWoLcKJ", "QBPZU1Dp"),
              ("Peaceful Nights", "wusZLXmN", "y93rTym7"),
          ]
          UNLISTED = [
              ("Architectury API", "lhGA9TYQ", "1IiqEQGl"),
              ("Gabou's Libs", "N8aGZtvj", "k5aZToKe"),
              ("GlitchCore", "s3dmwKy5", "S2TfWrZR"),
              ("Lithostitched", "XaDC71GB", "81DDKTGJ"),
              ("Sable", "T9PomCSv", "U678xqle"),
              ("Serene Seasons", "e0bNACJD", "SPj5bJoM"),
          ]
          ALL = NAMED + UNLISTED
          name_by_id = {pid: name for name, pid, _ in ALL}
          named_ids = {pid for _, pid, _ in NAMED}
          unlisted_ids = {pid for _, pid, _ in UNLISTED}

          edges = {}       # project_id -> [(dep_project_id, dependency_type), ...]
          missing = []     # (name, pid, vid) whose pinned version wasn't in the response
          errors = []      # (name, pid, vid, exit_code, message)

          for name, pid, vid in ALL:
              proc = subprocess.run(
                  ["bunx", "--bun", RINTH_REF, "--json", "versions", "list", pid],
                  capture_output=True, text=True,
              )
              with open(f"versions_{pid}.stdout.log", "w") as f:
                  f.write(proc.stdout)
              with open(f"versions_{pid}.stderr.log", "w") as f:
                  f.write(proc.stderr)
              if proc.returncode != 0:
                  errors.append((name, pid, vid, proc.returncode, proc.stderr.strip()))
                  edges[pid] = []
                  continue
              try:
                  versions = json.loads(proc.stdout)
              except Exception as e:
                  errors.append((name, pid, vid, proc.returncode, f"JSON parse error: {e}"))
                  edges[pid] = []
                  continue
              match = next((v for v in versions if v.get("id") == vid), None)
              if match is None:
                  missing.append((name, pid, vid))
                  edges[pid] = []
                  continue
              deps = match.get("dependencies") or []
              edges[pid] = [
                  (d.get("project_id"), d.get("dependency_type"))
                  for d in deps
                  if d.get("project_id")
              ]

          # BFS from every named mod through the dependency graph; record the
          # first (shortest) path that reaches each unlisted project id.
          results = {uid: None for uid in unlisted_ids}
          for start_name, start_id, _ in NAMED:
              visited = {start_id}
              queue = deque([(start_id, [])])
              while queue:
                  cur, path = queue.popleft()
                  for dep_id, dep_type in edges.get(cur, []):
                      if dep_id in visited:
                          continue
                      visited.add(dep_id)
                      new_path = path + [(name_by_id.get(cur, cur), name_by_id.get(dep_id, dep_id), dep_type)]
                      if dep_id in unlisted_ids and results[dep_id] is None:
                          results[dep_id] = new_path
                      queue.append((dep_id, new_path))

          lines = []
          lines.append("### Dependency check: are the six unlisted mods required by the eight named mods?")
          lines.append("")
          lines.append("| unlisted mod | project id | required? | path |")
          lines.append("|---|---|---|---|")
          any_required = False
          for name, pid, vid in UNLISTED:
              path = results[pid]
              if path is None:
                  lines.append(f"| {name} | `{pid}` | NOT REQUIRED BY ANY NAMED MOD (direct or transitive) | - |")
              else:
                  any_required = True
                  direct = len(path) == 1
                  label = "REQUIRED (direct)" if direct else "REQUIRED (transitive)"
                  chain = " -> ".join(f"{a} --({t})--> {b}" for a, b, t in path)
                  lines.append(f"| {name} | `{pid}` | {label} | {chain} |")
          lines.append("")

          if missing:
              lines.append("#### Pinned version id not found in `versions list` response")
              for name, pid, vid in missing:
                  lines.append(f"- {name} (`{pid}`): pinned version `{vid}` not present in the returned versions list")
              lines.append("")

          if errors:
              lines.append("#### Errors")
              for name, pid, vid, ec, msg in errors:
                  lines.append(f"- {name} (`{pid}`): exit `{ec}`: {msg}")
              lines.append("")

          lines.append("#### Raw dependency edges (every mod's pinned version, all dependencies, not just matches above)")
          lines.append("```")
          for name, pid, vid in ALL:
              deps = edges.get(pid, [])
              tag = "named" if pid in named_ids else "unlisted"
              if not deps:
                  lines.append(f"{name} ({pid}, {tag}): no dependencies recorded")
              else:
                  dep_strs = ", ".join(f"{name_by_id.get(d, d)}[{d}]:{t}" for d, t in deps)
                  lines.append(f"{name} ({pid}, {tag}): {dep_strs}")
          lines.append("```")

          summary = "\n".join(lines)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary + "\n")

          ec = 1 if (errors or missing) else 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"exit_code={ec}\n")
              f.write(f"any_required={'1' if any_required else '0'}\n")
          sys.exit(0)  # step's own exit is always 0; the Summary step judges overall pass/fail
          PY
          python3 dep_check.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rinth-dependency-check-json
          path: versions_*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        env:
          PROJECT_GET_EC: ${{ steps.project_get.outputs.exit_code }}
          DEP_CHECK_EC: ${{ steps.dep_check.outputs.exit_code }}
        run: |
          echo "project get:      $PROJECT_GET_EC"
          echo "dependency check: $DEP_CHECK_EC"
          {
            echo "## Result"
            echo "| command | exit code |"
            echo "|---|---|"
            echo "| project get (json) | $PROJECT_GET_EC |"
            echo "| dependency check | $DEP_CHECK_EC |"
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          if [ "$PROJECT_GET_EC" != "0" ]; then
            echo "::error::rinth --json project get exited non-zero ($PROJECT_GET_EC) — see the job summary above for stderr."
            fail=1
          fi
          if [ "$DEP_CHECK_EC" != "0" ]; then
            echo "::error::dependency check hit an error or a missing pinned version — see the job summary above."
            fail=1
          fi
          if [ "$fail" = "1" ]; then
            exit 1
          fi
