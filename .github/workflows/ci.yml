name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backup-inventory-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_inspect_backups.py'

  release-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_server_update_policy.py'

  build:
    uses: brooswit-minecraft/schematic/.github/workflows/reusable-ci.yml@v1
    secrets: inherit

  # MINECRAFT-38: fail when a pinned mod's required dependency is missing or
  # out of range. Pin the reviewed checker workflow to its immutable commit.
  dependency-check:
    uses: brooswit-minecraft/schematic/.github/workflows/reusable-dependency-check.yml@ae2ff76372e44189ad2c661bb6913cd9c244cd1d

  runtime-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and materialize the reviewed NeoForge runtime
        run: |
          make tools
          make verify-runtime
