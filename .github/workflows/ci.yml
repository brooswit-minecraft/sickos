name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    uses: brooswit-minecraft/schematic/.github/workflows/reusable-ci.yml@v1
    secrets: inherit

  # MINECRAFT-38: fail when a pinned mod's required dependency is missing or
  # out of range. Pinned to its own tag (not @v1) until v1 is reviewed forward.
  dependency-check:
    uses: brooswit-minecraft/schematic/.github/workflows/reusable-dependency-check.yml@dep-check-v1.0.0
