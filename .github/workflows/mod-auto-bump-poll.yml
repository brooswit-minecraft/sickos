name: Mod auto-bump poll

# MINECRAFT-362: the scheduled-reconciliation half of the generalized
# "any enrolled mod's verified release updates the pack" automation (see
# docs/mod-auto-bump.md). Dynamic Atmosphere's own dispatch-driven path
# (.github/workflows/da-auto-bump.yml) reacts to an event; this workflow
# reacts to nothing and instead asks Modrinth directly, on a schedule, for
# every OTHER eligible pin -- so a missed/replaced DA dispatch is not this
# path's concern, but every mod with no dispatch integration at all still
# gets covered. scripts/poll-mod-updates.py does the actual work; this
# file only wires triggers, the pause switch, credential selection, and
# the push -- the same split DA's workflow already uses.

on:
  workflow_dispatch: {}
  schedule:
    # Every 20 minutes. Modrinth has no documented rate-limit budget this
    # repo has measured against polling ~78 projects this often -- if that
    # becomes a problem, widen this interval; it is not load-bearing for
    # correctness (the engine is idempotent either way), only for how
    # promptly a non-DA mod's update is caught.
    - cron: "*/20 * * * *"

# Same shared group as da-auto-bump.yml, deliberately -- see that file's
# comment on this concurrency block for why a scheduled poll and a
# dispatch-driven bump must queue against each other, not just themselves.
concurrency:
  group: mod-auto-bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SICKOS_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.SICKOS_DISPATCH_APP_PRIVATE_KEY }}
      SICKOS_DISPATCH_TOKEN: ${{ secrets.SICKOS_DISPATCH_TOKEN }}
    steps:
      - name: Check pause switch
        id: pause
        env:
          PAUSED_VALUE: ${{ vars.SICKOS_MODBUMP_PAUSED }}
        run: |
          # Same rule as da-auto-bump.yml's own pause step (and
          # da_auto_bump_dispatch.pause_gate, reused directly below rather
          # than re-derived): exactly "true" pauses.
          if [ "$PAUSED_VALUE" = "true" ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report paused run
        if: steps.pause.outputs.paused == 'true'
        run: |
          echo "::warning::Mod auto-bump poll is paused (repo variable SICKOS_MODBUMP_PAUSED=true). Skipped this run entirely; the next unpaused scheduled run (or a manual workflow_dispatch) will reconcile from scratch."

      - uses: actions/checkout@v4
        if: steps.pause.outputs.paused != 'true'
        with:
          persist-credentials: false

      - name: Select push credential
        id: creds
        if: steps.pause.outputs.paused != 'true'
        env:
          APP_ID: ${{ vars.SICKOS_DISPATCH_APP_ID }}
          APP_KEY_SET: ${{ env.SICKOS_DISPATCH_APP_PRIVATE_KEY != '' }}
          PAT_SET: ${{ env.SICKOS_DISPATCH_TOKEN != '' }}
        run: |
          python3 scripts/da-auto-bump-dispatch.py select-credential \
            --app-id "$APP_ID" --app-key-set "$APP_KEY_SET" --pat-set "$PAT_SET" \
            --github-output "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.pause.outputs.paused != 'true'
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        if: steps.pause.outputs.paused != 'true'
        with:
          go-version: '1.23'

      - name: Install pinned packwiz
        if: steps.pause.outputs.paused != 'true'
        run: make tools

      - name: Run the mod auto-bump poll
        id: poll
        if: steps.pause.outputs.paused != 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set +e
          python3 scripts/poll-mod-updates.py \
            --repo-root . \
            --summary-out "$RUNNER_TEMP/summary.json"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          {
            echo "## Mod auto-bump poll"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run on a poll error
        if: steps.pause.outputs.paused != 'true' && steps.poll.outputs.exit_code != '0'
        run: |
          echo "::error::scripts/poll-mod-updates.py exited ${{ steps.poll.outputs.exit_code }}; see the job summary above for the per-mod outcome that failed. Any mod it already bumped and committed before the failure is still a fast-forward commit on this runner's checkout -- nothing is pushed by this job until the step below, so a failure here pushes nothing at all."
          exit 1

      - name: No push credential configured -- fail closed
        if: steps.pause.outputs.paused != 'true' && steps.poll.outputs.exit_code == '0' && steps.creds.outputs.method == 'none'
        run: |
          echo "::error::Mod auto-bump poll produced commits (if any) but no push credential is configured. Set one of: SICKOS_DISPATCH_APP_ID (repo variable) + SICKOS_DISPATCH_APP_PRIVATE_KEY (secret), or SICKOS_DISPATCH_TOKEN (secret) -- the same ones da-auto-bump.yml already uses. Nothing was pushed."
          exit 1

      - name: Mint push token (GitHub App)
        id: mint-app-token
        if: steps.pause.outputs.paused != 'true' && steps.poll.outputs.exit_code == '0' && steps.creds.outputs.method == 'app'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SICKOS_DISPATCH_APP_ID }}
          private-key: ${{ secrets.SICKOS_DISPATCH_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Push any commits to main
        if: steps.pause.outputs.paused != 'true' && steps.poll.outputs.exit_code == '0' && steps.creds.outputs.method != 'none'
        env:
          APP_TOKEN: ${{ steps.mint-app-token.outputs.token }}
          PAT_TOKEN: ${{ env.SICKOS_DISPATCH_TOKEN }}
          METHOD: ${{ steps.creds.outputs.method }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "Nothing to push: no mod had a compatible update this run."
            exit 0
          fi

          if [ "$METHOD" = "app" ]; then
            TOKEN="$APP_TOKEN"
          else
            TOKEN="$PAT_TOKEN"
          fi

          # Same auth-header approach as da-auto-bump.yml's push step, and
          # for the same reason: never persist the token into git config.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          if ! git -c http.https://github.com/.extraheader="$AUTH_HEADER" \
              push "https://github.com/${{ github.repository }}.git" HEAD:main; then
            echo "::error::Push to main was rejected (non-fast-forward, or branch protection). This run is safe to re-run: every engine run in scripts/poll-mod-updates.py is idempotent and will recompute fresh bumps against the current tip of main."
            exit 1
          fi
