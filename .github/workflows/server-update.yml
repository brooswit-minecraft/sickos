name: Server update
on:
  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: schematic-sftp-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: brooswit-minecraft/schematic
          ref: 13e633fcca27d2659b4393d5d84a0c389181b446
          path: .schematic-tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'paramiko==4.0.0'
      - name: Download exact release identity for compatibility receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.54.0 --repo "$GITHUB_REPOSITORY" --pattern '*.mrpack' --dir "$RUNNER_TEMP/verified-release"
      - name: Verify deployed mods, runtime readiness, and active world
        env:
          SERVER_SFTP_HOST: ${{ vars.SERVER_SFTP_HOST }}
          SERVER_SFTP_PORT: ${{ vars.SERVER_SFTP_PORT }}
          SERVER_SFTP_PATH: ${{ vars.SERVER_SFTP_PATH }}
          SERVER_SFTP_USERNAME: ${{ secrets.SERVER_SFTP_USERNAME }}
          SERVER_SFTP_PASSWORD: ${{ secrets.SERVER_SFTP_PASSWORD }}
          SERVER_SFTP_PRIVATE_KEY: ${{ secrets.SERVER_SFTP_PRIVATE_KEY }}
          SERVER_SFTP_KNOWN_HOSTS: ${{ secrets.SERVER_SFTP_KNOWN_HOSTS }}
          SERVER_RCON_HOST: ${{ vars.SERVER_RCON_HOST }}
          SERVER_RCON_PORT: ${{ vars.SERVER_RCON_PORT }}
          SERVER_RCON_PASSWORD: ${{ secrets.SERVER_RCON_PASSWORD }}
        run: python scripts/verify_server_054.py
      - name: Publish version and readiness evidence for the local updater
        uses: actions/upload-artifact@v4
        with:
          name: server-compatibility-0.54.0
          path: ${{ runner.temp }}/server-compatibility-0.54.0.json
          if-no-files-found: error
