name: Server update

# After a release publishes a version to Modrinth, re-points a
# Modrinth-hosted server's upstream at that version and restarts it. Skips
# cleanly (and the run still succeeds) when MODRINTH_SERVER_ID /
# MODRINTH_TOKEN are not configured — see the reusable-server-update.yml
# workflow this stub calls, upstream in brooswit-minecraft/schematic.
#
# Chained on the "Release" workflow's completion (workflow_run) rather than
# on `release: published` directly, so this only starts once release.yml has
# actually finished publishing to Modrinth — no race with the upstream
# reusable-release.yml workflow.
# `workflows: ["Release"]` matches release.yml's `name: Release` (its display
# name), NOT its filename — renaming that `name:` field would silently break
# this chain. NOTE: a workflow_run trigger only arms once this file is on the
# repo's default branch; it will not fire from a PR branch (see README) — an
# existing consumer's stub can keep the older `release: published` trigger
# indefinitely instead (see the migration note in README), it is not required
# to switch.
#
# This still needs a guard beyond "the Release run succeeded": release.yml
# also runs on workflow_dispatch for dry runs that deliberately create no
# GitHub Release (see README), and those must NOT trigger a server update.
# The `if:` below requires BOTH a successful conclusion AND that the Release
# run's own trigger was `release`, which excludes dry runs. It also has to
# admit this workflow's OWN workflow_dispatch (the manual re-point path) —
# `github.event.workflow_run.*` is unset there, so the guard is an explicit
# OR rather than a single combined condition.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to announce (defaults to the pack.toml version)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  deployment-policy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'release' || github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.policy.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: release-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Honor the originating release's deployment policy
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            # An explicit later deployment remains possible without republishing.
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            git -C release-source show -s --format=%B > "$RUNNER_TEMP/release-message.txt"
            python3 scripts/server_update_policy.py "$RUNNER_TEMP/release-message.txt" >> "$GITHUB_OUTPUT"
          fi

  server-update:
    needs: deployment-policy
    if: needs.deployment-policy.outputs.deploy == 'true'
    # Pin workflow and tools together, including readiness-gated compatibility publication.
    uses: brooswit-minecraft/schematic/.github/workflows/reusable-server-update.yml@f27f43679e34a4975e8e1b18cdf6528877c6e66d
    with:
      version: ${{ inputs.version }}
      allow-stopped: false
      backup: true
      server-address: breezy-trident848.modrinth.gg:25565
      tools-ref: f27f43679e34a4975e8e1b18cdf6528877c6e66d
    secrets: inherit
