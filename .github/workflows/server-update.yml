name: Server update
on:
  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string
permissions:
  contents: read
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: schematic-sftp-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: brooswit-minecraft/schematic
          ref: 13e633fcca27d2659b4393d5d84a0c389181b446
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
      - name: Check whether Minecraft is already running
        id: preflight
        continue-on-error: true
        env:
          SERVER_RCON_HOST: ${{ vars.SERVER_RCON_HOST }}
          SERVER_RCON_PORT: ${{ vars.SERVER_RCON_PORT }}
        run: python scripts/server_deploy.py preflight
      - name: Start the stopped server through its existing Hosting credential
        if: steps.preflight.outcome == 'failure'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          SERVER_ID: ${{ vars.MODRINTH_SERVER_ID }}
        run: bunx --bun github:brooswit-minecraft/rinth#v0.10.0 servers power "$SERVER_ID" start --json
      - name: Verify actual Minecraft readiness
        env:
          SERVER_RCON_HOST: ${{ vars.SERVER_RCON_HOST }}
          SERVER_RCON_PORT: ${{ vars.SERVER_RCON_PORT }}
          SERVER_RCON_PASSWORD: ${{ secrets.SERVER_RCON_PASSWORD }}
          SERVER_RCON_SHUTDOWN_TIMEOUT: '300'
        run: python scripts/server_deploy.py wait-ready
