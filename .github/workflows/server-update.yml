name: Server update

# After a release publishes a version to Modrinth, re-points a
# Modrinth-hosted server's upstream at that version and restarts it. Skips
# cleanly (and the run still succeeds) when MODRINTH_SERVER_ID /
# MODRINTH_TOKEN are not configured — see reusable-server-update.yml.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to announce (defaults to the pack.toml version)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  server-update:
    uses: brooswit-minecraft/schematic/.github/workflows/reusable-server-update.yml@v1
    with:
      version: ${{ inputs.version }}
    secrets: inherit
