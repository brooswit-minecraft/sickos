name: Server update

# Uploads the packwiz pack to a game server over FTP, then announces and
# restarts it over RCON. Both halves skip independently (and the run still
# succeeds) when their secrets are not configured — see reusable-server-update.yml.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to announce (defaults to the pack.toml version)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  server-update:
    uses: brooswit-minecraft/schematic/.github/workflows/reusable-server-update.yml@v1
    with:
      version: ${{ inputs.version }}
    secrets: inherit
