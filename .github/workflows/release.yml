name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Pack version to build, e.g. 0.1.0 (for dry runs — no GitHub Release is created)"
        required: true
        type: string

jobs:
  release:
    # release.yml attaches an asset to a GitHub Release, so it needs write access.
    # ci.yml only reads the repo, so keep that workflow's permissions untouched.
    permissions:
      contents: write
    uses: brooswit-minecraft/schematic/.github/workflows/reusable-release.yml@v1
    with:
      version: ${{ inputs.version }}
    secrets: inherit
