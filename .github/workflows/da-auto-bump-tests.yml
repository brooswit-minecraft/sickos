name: DA auto-bump engine tests

on:
  pull_request:
    paths:
      - scripts/bump-dynamic-atmosphere.py
      - scripts/da-auto-bump-dispatch.py
      - scripts/release_decisions.py
      - scripts/modrinth_metadata.py
      - scripts/semver_compare.py
      - scripts/mod_eligibility.py
      - scripts/modrinth_compat.py
      - scripts/bump_mod.py
      - scripts/poll-mod-updates.py
      - scripts/github_release_identity.py
      - scripts/bump_mod_github.py
      - tests/test_bump_dynamic_atmosphere.py
      - tests/test_da_auto_bump_dispatch.py
      - tests/test_modrinth_metadata.py
      - tests/test_semver_compare.py
      - tests/test_mod_eligibility.py
      - tests/test_modrinth_compat.py
      - tests/test_bump_mod.py
      - tests/test_poll_mod_updates.py
      - tests/test_auto_bump_workflow_checkout.py
      - tests/test_github_release_identity.py
      - tests/test_bump_mod_github.py
      - .github/workflows/da-auto-bump-tests.yml
      - .github/workflows/da-auto-bump.yml
      - .github/workflows/mod-auto-bump-poll.yml
  push:
    branches: [main]
    paths:
      - scripts/bump-dynamic-atmosphere.py
      - scripts/da-auto-bump-dispatch.py
      - scripts/release_decisions.py
      - scripts/modrinth_metadata.py
      - scripts/semver_compare.py
      - scripts/mod_eligibility.py
      - scripts/modrinth_compat.py
      - scripts/bump_mod.py
      - scripts/poll-mod-updates.py
      - scripts/github_release_identity.py
      - scripts/bump_mod_github.py
      - tests/test_bump_dynamic_atmosphere.py
      - tests/test_da_auto_bump_dispatch.py
      - tests/test_modrinth_metadata.py
      - tests/test_semver_compare.py
      - tests/test_mod_eligibility.py
      - tests/test_modrinth_compat.py
      - tests/test_bump_mod.py
      - tests/test_poll_mod_updates.py
      - tests/test_auto_bump_workflow_checkout.py
      - tests/test_github_release_identity.py
      - tests/test_bump_mod_github.py
      - .github/workflows/da-auto-bump-tests.yml
      - .github/workflows/da-auto-bump.yml
      - .github/workflows/mod-auto-bump-poll.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          # Same as the `runtime-compatibility` job's own `make tools`
          # step in ci.yml -- `stable` rather than a hardcoded minimum,
          # so this does not need Go's own toolchain-switch machinery to
          # satisfy whatever Go version a future PACKWIZ_REF bump pins.
          go-version: stable
      # MINECRAFT-362, fourteenth review round: tests/test_bump_mod.py's
      # TestRealPackwizDryRun exercises the real packwiz binary (not the
      # `true`/`false` stand-ins every other test here uses), the one
      # test in this job that evaluates `make check`'s actual predicate.
      # Without this, that test silently skips (packwiz not found) and
      # this job's green checkmark means nothing about whether a real
      # bump can actually pass its own gates.
      - name: Install pinned packwiz
        run: make tools
      - name: Run DA auto-bump engine tests
        run: python -m unittest discover -s tests -p 'test_bump_dynamic_atmosphere.py'
      - name: Run DA auto-bump dispatch-workflow tests (SICKOS-78)
        run: python -m unittest discover -s tests -p 'test_da_auto_bump_dispatch.py'
      - name: Run shared Modrinth metadata gate tests (MINECRAFT-362)
        run: python -m unittest discover -s tests -p 'test_modrinth_metadata.py'
      - name: Run shared semver comparator tests (MINECRAFT-362)
        run: python -m unittest discover -s tests -p 'test_semver_compare.py'
      - name: Run mod enrollment/eligibility tests (MINECRAFT-362)
        run: python -m unittest discover -s tests -p 'test_mod_eligibility.py'
      - name: Run mod compatibility-resolution tests (MINECRAFT-362)
        run: python -m unittest discover -s tests -p 'test_modrinth_compat.py'
      - name: Run generic mod auto-bump engine tests (MINECRAFT-362)
        run: python -m unittest discover -s tests -p 'test_bump_mod.py'
      - name: Run mod auto-bump poll tests (MINECRAFT-362)
        run: python -m unittest discover -s tests -p 'test_poll_mod_updates.py'
      - name: Run auto-bump workflow checkout-pinning tests (MINECRAFT-362)
        run: python -m unittest discover -s tests -p 'test_auto_bump_workflow_checkout.py'
      - name: Run GitHub-release identity tests (MINECRAFT-362)
        run: python -m unittest discover -s tests -p 'test_github_release_identity.py'
      - name: Run GitHub-release mod auto-bump engine tests (MINECRAFT-362)
        run: python -m unittest discover -s tests -p 'test_bump_mod_github.py'

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          # Independent of the Makefile's PACKWIZ_REF toolchain pin below --
          # actionlint v1.7.12 needs Go >= 1.25, one job, no shared state.
          go-version: '1.25'
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint da-auto-bump.yml (SICKOS-78)
        run: "$(go env GOPATH)/bin/actionlint .github/workflows/da-auto-bump.yml"
      - name: Lint mod-auto-bump-poll.yml (MINECRAFT-362)
        run: "$(go env GOPATH)/bin/actionlint .github/workflows/mod-auto-bump-poll.yml"
